x-build-args: &python-build-args
  PYTHON_VERSION: ${PYTHON_VERSION:-3.13.10}
name: tarameteo

include:
  - path: ./taracert/compose.yml

services:

  api:
    build:
      context: backend
      args:
        <<: *python-build-args
    depends_on:
      ca:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      CA_URL: http://tarameteo-ca/v1/certs
      CA_TOKEN: ${CA_TOKEN}
      INFLUX_URL: http://tarameteo-influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-tarameteo}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-weather}
    networks:
      default:
        aliases:
          - tarameteo-api
    command: uvicorn --host=0.0.0.0 --port=80 tarameteo.api:app --log-config=/app/log-config.yaml
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).status==200 else 1)" ]
      start_period: 10s
      interval: 10s
      timeout: 5s

  ca:
    build:
      context: backend
      args:
        <<: *python-build-args
    depends_on:
      ca-init:
        condition: service_completed_successfully
    volumes:
      - ca-tls:/ca:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      CA_KEY: /ca/ca.key
      CA_CERT: /ca/ca.pem
      CA_TOKEN: ${CA_TOKEN}
    networks:
      default:
        aliases:
          - tarameteo-ca
    command: uvicorn --host=0.0.0.0 --port=80 tarameteo.ca:app --log-config=/app/log-config.yaml
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).status==200 else 1)" ]
      start_period: 10s
      interval: 10s
      timeout: 5s

  ca-init:
    build: ca
    volumes:
      - ca-tls:/ca
    environment:
      CA_DIR: /ca
    command: /init.sh
    restart: no

  ca-publish:
    build: ca
    depends_on:
      ca-init:
        condition: service_completed_successfully
    volumes:
      - ca-tls:/ca-tls:ro
      - ca-trust:/ca-trust
    environment:
      CA_TLS_DIR: /ca-tls
      CA_TRUST_DIR: /ca-trust
    command: /publish.sh
    restart: no

  consumer:
    build:
      context: backend
      args:
        <<: *python-build-args
    depends_on:
      consumer-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - consumer-tls:/tls:ro
    environment:
      MQTT_BROKER_HOST: tarameteo-mosquitto
      MQTT_BROKER_PORT: 8883
      MQTT_CERT_PATH: /tls/consumer.pem
      MQTT_KEY_PATH: /tls/consumer.key
      MQTT_CA_PATH: /tls/ca.pem
      INFLUX_URL: http://tarameteo-influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-tarameteo}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-weather}
    networks:
      default:
        aliases:
          - tarameteo-consumer
    command: tarameteo-consumer
    restart: always

  consumer-init:
    build:
      context: backend
      args:
        <<: *python-build-args
    depends_on:
      ca:
        condition: service_healthy
    volumes:
      - consumer-tls:/tls
    environment:
      PKI_API_URL: http://tarameteo-ca/v1/certs
      PKI_API_TOKEN: ${CA_TOKEN}
      PKI_OUTPUT_DIR: /tls
    command: tarameteo-pki rotate consumer
    restart: no

  consumer-rotate:
    build:
      context: backend
      args:
        <<: *python-build-args
    depends_on:
      ca:
        condition: service_healthy
      consumer-init:
        condition: service_completed_successfully
    volumes:
      - consumer-tls:/tls
    environment:
      PKI_API_URL: http://tarameteo-ca/v1/certs
      PKI_API_TOKEN: ${CA_TOKEN}
      PKI_OUTPUT_DIR: /tls
    command: >
      sh -c "while :; do
        tarameteo-pki check consumer
        case $? in
          0) : ;;
          1) tarameteo-pki renew consumer ;;
          2) tarameteo-pki rotate consumer ;;
          *) exit 1
        esac
        sleep 12h
      done"
    restart: always
  frontend:
    build:
      context: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    networks:
      default:
        aliases:
          - tarameteo-frontend
    restart: always

  influxdb:
    image: influxdb:2.8
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-tarameteo}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-weather}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-7d}
    networks:
      default:
        aliases:
          - tarameteo-influx
    restart: always
    healthcheck:
      test: [ "CMD", "influx", "ping" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    build: mosquitto
    depends_on:
      ca-publish:
        condition: service_completed_successfully
      certbot:
        condition: service_healthy
    volumes:
      - ca-trust:/etc/mosquitto/pki:ro
      - certbot-certs:/etc/letsencrypt:ro
      - mosquitto-data:/mosquitto/data
      - ./mosquitto/mosquitto.tpl:/mosquitto.tpl
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-admin}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MOSQUITTO_TEMPLATE: /mosquitto.tpl
    ports:
      - '${MQTT_PORT:-1883}:1883'
      - '${MQTTS_PORT:-8883}:8883'
    networks:
      default:
        aliases:
          - tarameteo-mosquitto
    restart: always

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${IPV4_NETWORK:-172.22.1}.0/24

volumes:
  ca-tls:
  ca-trust:
  consumer-tls:
  influxdb-data:
  influxdb-config:
  mosquitto-data:
