name: tarameteo

services:
  api:
    volumes:
      - ./backend/tarameteo:/app/tarameteo
    command: uvicorn --host=0.0.0.0 --port=80 tarameteo.api:app --log-config=/app/log-config.dev.yaml --reload --reload-exclude='.*'

  ca:
    volumes:
      - ./backend/tarameteo:/app/tarameteo
    command: uvicorn --host=0.0.0.0 --port=80 tarameteo.ca:app --log-config=/app/log-config.dev.yaml --reload --reload-exclude='.*'

  certbot:
    depends_on:
      ca-init:
        condition: service_completed_successfully
    volumes:
      - ./taracert/generate-cert.sh:/generate-cert.sh:ro
      - ca-tls:/ca:ro
    environment:
      CA_CERT_PATH: /ca/ca.pem
      CA_KEY_PATH: /ca/ca.key
      SAN_IPS: ${IPV4_NETWORK:-172.22.1}.0/24
    command: >
      sh -c "trap exit TERM; /generate-cert.sh; /deploy-hook.sh; echo Ready; sleep infinity"
