[project]
name = "tarameteo-firmware"
version = "0.0.0"
description = "Weather station firmware"
authors = [
    {name = "Marc Tardif", email = "marc@taram.ca"}
]
readme = "README.rst"
requires-python = ">=3.13,<4.0"
dependencies = [
    "esp-idf-nvs-partition-gen (>=0.3.0,<1.0.0)",
    "esptool (>=5.6.0,<6.0.0)",
    "platformio (>=6.1.18,<7.0.0)",
    "tarameteo",
]

[tool.uv.sources]
tarameteo = { path = "../backend", editable = true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
