[platformio]
default_envs = esp32

[env]
# Global library dependency finder settings
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.14

; Native environment for unit testing (runs on host machine)
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -DARDUINO=200
    -fprofile-arcs
    -ftest-coverage
    -Itest/mocks
extra_scripts = pre:scripts/native_coverage.py
test_framework = unity
test_ignore = test_integration

; Static analysis environment (for clang-tidy)
[env:analysis]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -DARDUINO=200
    -Itest/mocks
    ; Local library include paths for clang-tidy
    -Ilib/WiFiManager
    -Ilib/BME280Sensor
    -Ilib/I2CAddressList
    -Ilib/Station/include
    -Ilib/Station/src
    -Ilib/MqttClient
    -Ilib/PowerManager
    -Ilib/TimeManager
    ; External library include paths
    -I.pio/libdeps/analysis/PubSubClient/src
    -I.pio/libdeps/analysis/ArduinoJson/src
    "-I.pio/libdeps/analysis/Adafruit BME280 Library"
    "-I.pio/libdeps/analysis/Adafruit Unified Sensor"
    "-I.pio/libdeps/analysis/Adafruit BusIO"

; ESP32 environment for integration testing (runs on device)
[env:esp32]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = partitions.csv
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2
build_flags =
    -DMBEDTLS_X509_CRT_PARSE_C
    -DMBEDTLS_PEM_PARSE_C
    ; Phones the board stays paired with. NimBLE's default of 3 drops the oldest
    ; bond silently, and that phone then fails every read until it forgets the
    ; board. Each bond keeps one CCCD (Status), within the default of 8.
    -DCONFIG_BT_NIMBLE_MAX_BONDS=8
test_framework = unity
test_filter = test_integration
upload_speed = 921600
monitor_speed = 115200

; For running tests on actual hardware
test_port = /dev/ttyACM0
test_speed = 115200

; Same firmware on the XIAO ESP32S3: make ENV=esp32s3
[env:esp32s3]
extends = env:esp32
board = seeed_xiao_esp32s3
