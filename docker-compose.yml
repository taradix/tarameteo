x-build-args: &python-build-args
  PYTHON_VERSION: ${PYTHON_VERSION:-3.13.10}
name: tarameteo
include:
  - path: ./taracert/compose.yml
services:
  api:
    build:
      context: backend
      args:
        <<: *python-build-args
    depends_on:
      issuer:
        condition: service_healthy
    command: >
      bash -c "uvicorn --host=0.0.0.0 --port=80 tarameteo.api:app --log-config=/app/log-config.yaml"
    environment:
      - ISSUER_URL=http://tarameteo-issuer
      - ISSUER_TOKEN=${ISSUER_TOKEN}
    networks:
      default:
        aliases:
          - tarameteo-api
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).status==200 else 1)"]
      start_period: 10s
      interval: 10s
      timeout: 5s

  issuer:
    build:
      context: backend
      args:
        <<: *python-build-args
    depends_on:
      pki-init:
        condition: service_completed_successfully
    volumes:
      - pki-root:/pki:ro
    command: >
      bash -c "uvicorn --host=0.0.0.0 --port=80 tarameteo.issuer:app --log-config=/app/log-config.yaml"
    environment:
      - ISSUER_TOKEN=${ISSUER_TOKEN}
    networks:
      default:
        aliases:
          - tarameteo-issuer
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).status==200 else 1)"]
      start_period: 10s
      interval: 10s
      timeout: 5s

  mosquitto:
    build: mosquitto
    depends_on:
      certbot:
        condition: service_healthy
      pki-publish:
        condition: service_completed_successfully
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - pki-trust:/etc/mosquitto/pki:ro
      - mosquitto-data:/mosquitto/data
      - ./mosquitto/mosquitto.tpl:/mosquitto.tpl
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-admin}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MOSQUITTO_TEMPLATE=/mosquitto.tpl
    ports:
      - '${MQTT_PORT:-1883}:1883'
      - '${MQTTS_PORT:-8883}:8883'
    networks:
      default:
        aliases:
          - tarameteo-mosquitto
    restart: always

  pki-init:
    build: pki
    volumes:
      - pki-root:/pki
    command: /init.sh
    restart: "no"

  pki-publish:
    build: pki
    depends_on:
      pki-init:
        condition: service_completed_successfully
    volumes:
      - pki-root:/pki:ro
      - pki-trust:/trust
    command: /publish.sh
    restart: "no"

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${IPV4_NETWORK:-172.22.1}.0/24

volumes:
  mosquitto-data:
  pki-root:
  pki-trust:
