name: firmware-release

# Each board's image on firmware-v* tags: attached to a GitHub release, then uploaded
# to the backend, which offers it to the boards (firmware/<board> over MQTT).
on:
  push:
    tags:
      - firmware-v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The PlatformIO envs, which name the boards (FIRMWARE_BOARD in platformio.ini).
        env: [esp32, esp32s3]
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up firmware environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: "3.15"
          working-directory: firmware

      # PlatformIO fails the build when the image outgrows its app slot (partitions.csv).
      - name: Build image
        run: |
          version=${GITHUB_REF_NAME#firmware-v}
          make setup ENV=${{ matrix.env }} FIRMWARE_VERSION="$version"
          mkdir -p dist
          cp .pio/build/${{ matrix.env }}/firmware.bin "dist/tarameteo-${{ matrix.env }}-$version.bin"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/dist/*.bin

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.bin --repo "$GITHUB_REPOSITORY" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.bin --repo "$GITHUB_REPOSITORY" --clobber

      # Last: once uploaded, the boards install it at their next wake.
      - name: Upload images to the backend
        env:
          FIRMWARE_TOKEN: ${{ secrets.FIRMWARE_TOKEN }}
          FIRMWARE_API_URL: ${{ vars.FIRMWARE_API_URL || 'https://meteo.taram.ca' }}
        run: |
          test -n "$FIRMWARE_TOKEN" || { echo "FIRMWARE_TOKEN secret is missing"; exit 1; }
          version=${GITHUB_REF_NAME#firmware-v}
          for image in dist/*.bin; do
            board=$(basename "$image" .bin)
            board=${board#tarameteo-}
            board=${board%-"$version"}
            curl --fail-with-body -sS -X PUT --data-binary "@$image" \
              -H "Authorization: Bearer $FIRMWARE_TOKEN" -H "Content-Type: application/octet-stream" \
              "$FIRMWARE_API_URL/api/firmware/$board/$version.bin"
            echo
          done
