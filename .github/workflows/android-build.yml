name: android-build

# Signed release APK of the native app; attached to a GitHub release on android-v* tags.
on:
  push:
    tags:
      - android-v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java environment
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "ANDROID_KEYSTORE secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The run number only grows, so every build installs over the previous one.
      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_releaseKeystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_releaseKeystorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mapsApiKey: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#android-v}; else version=0.0.0-${GITHUB_SHA::7}; fi
          ./gradlew assembleRelease -PversionName="$version" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tarameteo-apk
          path: android/build/outputs/apk/release/tarameteo-release.apk

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/outputs/apk/release/tarameteo-release.apk --generate-notes
