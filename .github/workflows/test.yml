name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: clang-format clang-tidy
          version: 1.0

      - name: Set up Node environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up backend environment
        uses: ./.github/actions/setup-uv-env
        with:
          extras: check
          python-version: "3.14"
          working-directory: backend

      - name: Set up firmware environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: "3.14"
          working-directory: firmware

      - name: Run check target
        run: make check

  firmware-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: "3.14"
          working-directory: firmware

      - name: Create config.h from example
        working-directory: firmware
        run: |
          if [ ! -f include/config.h ]; then
            cp include/config.h.example include/config.h
            echo "Created config.h from example"
          fi

      - name: Test firmware
        working-directory: firmware
        run: make test

      - name: "Upload coverage data"
        uses: actions/upload-artifact@v7
        with:
          name: firmware-coverage
          path: firmware/.pio/build/native
          if-no-files-found: ignore
          include-hidden-files: true

  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32, esp32c3]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: "3.14"
          working-directory: firmware

      # Placeholder certs so embed_certs.py skips issuing from the CA.
      - name: Prepare config and certs
        working-directory: firmware
        run: |
          cp include/config.h.example include/config.h
          mkdir -p certs
          for f in client.pem client.key ca.pem; do echo placeholder > certs/$f; done
          echo ci > certs/.sensor_id

      # PlatformIO fails the build if the image exceeds the app partition.
      - name: Build firmware
        working-directory: firmware
        shell: bash
        env:
          SENSOR_ID: ci
        run: |
          uv run pio run -e ${{ matrix.env }} | tee build.log
          echo "**${{ matrix.env }}**: $(grep -E '^(RAM|Flash):' build.log | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY

  firmware-coverage:
    runs-on: ubuntu-latest
    needs: firmware-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: lcov
          version: 1.0

      - name: Set up Python environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: "3.14"
          working-directory: firmware

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          path: firmware

      - name: Run coverage target
        working-directory: firmware
        run: make coverage

      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@v7
        with:
          name: firmware-report
          path: firmware
        if: ${{ failure() }}

  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-uv-env
        with:
          extras: test
          python-version: ${{ matrix.python-version }}
          working-directory: backend

      - name: Run backend test target
        working-directory: backend
        run: make test

      - name: "Upload coverage data"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: backend/.coverage.*
          if-no-files-found: ignore
          include-hidden-files: true

  backend-coverage:
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python environment
        uses: ./.github/actions/setup-uv-env
        with:
          extras: test
          python-version: "3.14"
          working-directory: backend

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          path: backend
          pattern: coverage-data-*
          merge-multiple: true

      - name: Run coverage target
        working-directory: backend
        run: make coverage

      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@v7
        with:
          name: backend-report
          path: htmlcov
        if: ${{ failure() }}

  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test target
        working-directory: frontend
        run: make test

  frontend-coverage:
    runs-on: ubuntu-latest
    needs: frontend-test

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run coverage target
        working-directory: frontend
        run: make coverage

      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@v7
        with:
          name: frontend-report
          path: coverage
        if: ${{ failure() }}
